name: 提需求
description: 提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 想要解决的问题
      description: 请说明这个需求要解决什么问题或痛点。
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: 期望的方案
      description: 请描述你希望 ZCode 如何解决上述问题。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 可选。你考虑过的其他方案或临时解决办法。
    validations:
      required: false
  - type: textarea
    id: use-cases
    attributes:
      label: 使用场景
      description: 请描述该需求对应的实际使用场景。
    validations:
      required: true
