name: 问题上报
description: 报告使用 ZCode 时遇到的缺陷或异常
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请简要说明遇到的问题。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请列出可以稳定复现该问题的操作步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected-and-actual
    attributes:
      label: 期望/实际行为
      description: 请说明期望发生的行为，以及实际发生的行为。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境信息
      description: 请填写版本号 / 操作系统，例如 ZCode v3.16.4 / macOS 15.3。
      placeholder: 版本号 / 操作系统
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可选。日志文件或截图可以直接拖拽到此处上传。
    validations:
      required: false
