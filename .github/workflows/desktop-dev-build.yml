name: Desktop Dev Build

# dev 专用构建通道:
#   - 手动触发(workflow_dispatch),安装包发布到滚动 prerelease 标签 `dev`
#     (Actions Artifacts 仍保留作备份,但只含安装包本体);
#   - 不进入软件更新线路的双保险:更新器只读 releases/latest,而 latest 排除
#     prerelease;且 dev 发布不上传 latest*.yml,任何通道都无法解析为更新。
#   - 正式发版走 desktop-release.yml(推 v* 标签,含 latest.yml)。
#
# 触发方式:Actions 页面 → Desktop Dev Build → Run workflow → 选择目标。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "构建目标"
        type: choice
        default: mac-arm64
        options:
          - mac-arm64
          - mac-x64
          - win-x64
          - all

permissions:
  contents: read

concurrency:
  group: desktop-dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            all)
              MATRIX='[{"name":"mac-arm64","runner":"macos-15","bundle-args":"--os mac --arch arm64"},{"name":"mac-x64","runner":"macos-15-intel","bundle-args":"--os mac --arch x64"},{"name":"win-x64","runner":"windows-latest","bundle-args":"--os win --arch x64"}]'
              ;;
            mac-arm64)
              MATRIX='[{"name":"mac-arm64","runner":"macos-15","bundle-args":"--os mac --arch arm64"}]'
              ;;
            mac-x64)
              MATRIX='[{"name":"mac-x64","runner":"macos-15-intel","bundle-args":"--os mac --arch x64"}]'
              ;;
            win-x64)
              MATRIX='[{"name":"win-x64","runner":"windows-latest","bundle-args":"--os win --arch x64"}]'
              ;;
            *)
              echo "unknown target: ${{ inputs.target }}" >&2
              exit 1
              ;;
          esac
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      # 与正式发布一致的产品身份;dev 区别只在分发方式(Artifacts,不进更新通道)。
      ZCODE_ENV: production
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle desktop installer
        run: pnpm bundle:desktop -- ${{ matrix.bundle-args }}

      - name: Upload dev artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-desktop-${{ matrix.name }}-${{ github.run_number }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-dev:
    name: Publish dev prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: dev-desktop-*
          merge-multiple: true

      - name: Publish rolling dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 滚动标签:删除旧的 dev release 与 tag,再以当前提交重建(prerelease)。
          # tag 删除在 GitHub 侧异步生效,create 可能短暂撞上 "tag already exists",重试兜底。
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            if gh release create dev installers/* -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Dev Build" \
              --notes "手动触发的开发构建。prerelease + 不含 latest*.yml,不会进入自动更新通道。"; then
              exit 0
            fi
            echo "release create attempt $attempt failed (tag propagation?), retrying in 10s..."
            sleep 10
            # 重试前确保残留 tag 被清掉(delete 幂等,失败无所谓)。
            gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          done
          echo "failed to publish rolling dev prerelease after 5 attempts" >&2
          exit 1
